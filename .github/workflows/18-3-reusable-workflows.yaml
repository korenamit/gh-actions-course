name: 18.3 - Reusable Workflows
on:
  workflow_dispatch:
jobs:
    deploy:
        uses: ./.github/workflows/18-3-reusable-workflows.yaml
        with:
          target_directory: dummy_dir
    print_outputs:
        runs-on: ubuntu-latest
        needs: deploy
        steps:
          - name: Print outputs
            run: |
              echo "Build Status: ${{ needs.deploy.outputs.build-status }}"
              echo "URL: {{ needs.deploy.outputs.url }}"
