name: 16 - Working With Environments

on:
    workflow_dispatch: 

jobs:
    deploy-staging:
        runs-on: ubuntu-latest
        environment: staging            
        env:
            my-env-value: ${{vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Vars
              run: |
                echo "Deploying to staging"
    e2e-tests:
        needs: deploy-staging
        runs-on: ubuntu-latest
        steps:
            - name: E2E Tests
              run: echo "Running E2E"
    deploy-prod-frontend:
        needs: e2e-tests
        runs-on: ubuntu-latest
        environment: prod
        env:
            my-env-value: ${{vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Vars
              run: |
                echo "Deploying to prod frontend"
    deploy-prod-backend:
        needs: e2e-tests
        runs-on: ubuntu-latest
        environment: prod
        env:
            my-env-value: ${{vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Vars
              run: |
                echo "Deploying to prod backend"
    deploy-prod-backend2:
        needs: e2e-tests
        runs-on: ubuntu-latest
        environment: prod
        env:
            my-env-value: ${{vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo Vars
              run: |
                echo "Deploying to prod backend 2"
            